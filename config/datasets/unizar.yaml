---
# ROS input for the UNIZAR recordings: one camera with closed-set semantics.
# The sensor frame comes from the camera info and the robot frame from
# `robot_frame`, so neither is set here.
input:
  type: RosInput
  tf_verbosity: 1
  clear_queue_on_fail: true
  inputs:
    left_cam:
      receiver:
        type: ClosedSetImageReceiver
      sensor:
        type: camera_info
        min_range: 0.1
        max_range: 5.0
        extrinsics:
          type: ros
